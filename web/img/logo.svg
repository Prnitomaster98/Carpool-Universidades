<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo de Carpool por zonas: un marcador de punto de encuentro
       con dos personas adentro (el que maneja y el que se une). -->
  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- El marcador -->
  <path d="M32 4C20.4 4 11 13.2 11 24.6 11 39.8 32 60 32 60s21-20.2 21-35.4C53 13.2 43.6 4 32 4z" fill="url(#verde)"/>
  <!-- Persona 1 (aro oscuro con centro blanco) -->
  <circle cx="26" cy="24" r="7.5" fill="#0b1110" opacity=".9"/>
  <!-- Persona 2 (círculo blanco, encima) -->
  <circle cx="38" cy="24" r="7.5" fill="#ffffff"/>
  <circle cx="26" cy="24" r="4" fill="#ffffff"/>
</svg>
